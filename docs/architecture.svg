  <!-- ================= redis ================= -->
  <g>
    <rect x="913" y="290" width="334" height="504" rx="18" fill="#0b1a33" opacity="0.07"/>
    <rect x="910" y="286" width="334" height="504" rx="18" fill="#fff8f7" stroke="#f3cdc8" stroke-width="1.4"/>

    <path d="M932 306 v18 a11 4.5 0 0 0 22 0 v-18" fill="#fca5a5" stroke="#dc2626" stroke-width="1.3"/>
    <ellipse cx="943" cy="306" rx="11" ry="4.5" fill="#fecaca" stroke="#dc2626" stroke-width="1.3"/>
    <path d="M932 312 a11 4.5 0 0 0 22 0" fill="none" stroke="#dc2626" stroke-width="1.1"/>

    <text x="968" y="322" class="panel-title" fill="#7f1d1d">Redis · 状态与扩散</text>
    <text x="932" y="350" class="small" fill="#9a4a42">在线状态权威来源：presence TTL 20s</text>

    <rect x="932" y="366" width="290" height="27" rx="7" fill="#ffffff" stroke="#f3d9d5"/>
    <text x="944" y="384" class="key">presence:user:{uid}</text>
    <text x="1210" y="384" text-anchor="end" class="ktype">hash · TTL 20s</text>

    <rect x="932" y="397" width="290" height="27" rx="7" fill="#ffffff" stroke="#f3d9d5"/>
    <text x="944" y="415" class="key">presence:index</text>
    <text x="1210" y="415" text-anchor="end" class="ktype">zset · 过期索引</text>

    <rect x="932" y="428" width="290" height="27" rx="7" fill="#ffffff" stroke="#f3d9d5"/>
    <text x="944" y="446" class="key">node:{id}</text>
    <text x="1210" y="446" text-anchor="end" class="ktype">hash · TTL 15s</text>

    <rect x="932" y="459" width="290" height="27" rx="7" fill="#ffffff" stroke="#f3d9d5"/>
    <text x="944" y="477" class="key">nodes:index</text>
    <text x="1210" y="477" text-anchor="end" class="ktype">zset · 节点注册表</text>

    <rect x="932" y="490" width="290" height="27" rx="7" fill="#ffffff" stroke="#f3d9d5"/>
    <text x="944" y="508" class="key">room:{id}:members</text>
    <text x="1210" y="508" text-anchor="end" class="ktype">set · 房间成员</text>

    <rect x="932" y="521" width="290" height="27" rx="7" fill="#ffffff" stroke="#f3d9d5"/>
    <text x="944" y="539" class="key">user:{uid}:rooms</text>
    <text x="1210" y="539" text-anchor="end" class="ktype">set · 用户房间</text>

    <rect x="932" y="552" width="290" height="27" rx="7" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.1"/>
    <text x="944" y="570" class="key" font-weight="700" fill="#991b1b">push:node:{id}</text>
    <text x="1210" y="570" text-anchor="end" class="ktype" font-weight="700" fill="#991b1b">Pub/Sub · 跨节点</text>

    <rect x="932" y="598" width="290" height="72" rx="9" fill="#fef2f2" stroke="#fecaca"/>
    <text x="944" y="620" class="hdr" fill="#991b1b">Pub/Sub 只投在线节点</text>
    <text x="944" y="640" class="small" fill="#9a4a42">节点间无直接 RPC，各节点</text>
    <text x="944" y="656" class="small" fill="#9a4a42">订阅自己的 push:node:{id}。</text>

    <rect x="932" y="682" width="290" height="72" rx="9" fill="#fffbeb" stroke="#fde68a"/>
    <text x="944" y="704" class="hdr" fill="#92400e">TTL 兜底幽灵在线</text>
    <text x="944" y="724" class="small" fill="#9a6b2f">回调 / 半开 / kill 都不可靠。</text>
    <text x="944" y="740" class="small" fill="#9a6b2f">过期即离线，心跳 5s 续期。</text>
  </g>

