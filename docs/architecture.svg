  <!-- ================= browsers ================= -->
  <g>
    <rect x="39" y="254" width="154" height="140" rx="12" fill="#0b1a33" opacity="0.07"/>
    <rect x="36" y="250" width="154" height="140" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.4"/>
    <path d="M36 262 a12 12 0 0 1 12 -12 h130 a12 12 0 0 1 12 12 v14 h-154 z" fill="#f5f2ff"/>
    <circle cx="50" cy="264" r="3" fill="#f87171"/>
    <circle cx="62" cy="264" r="3" fill="#fbbf24"/>
    <circle cx="74" cy="264" r="3" fill="#34d399"/>
    <text x="50" y="306" font-size="14" font-weight="700" fill="#5b21b6">Browser A</text>
    <rect x="134" y="294" width="42" height="18" rx="9" fill="#ede9fe"/>
