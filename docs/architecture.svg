    <text x="324" y="168" class="small">宿主 18080 · 独立进程</text>

    <!-- nginx -->
    <rect x="240" y="194" width="250" height="248" rx="12" fill="#f4f8ff" stroke="#c9dcff" stroke-width="1.2"/>
    <rect x="254" y="210" width="22" height="22" rx="7" fill="#2563eb"/>
