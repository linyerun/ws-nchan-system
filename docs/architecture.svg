      <path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/>
    </marker>
    <style type="text/css">
      text {
        font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
      }
      .mono { font-family: "SF Mono", "Menlo", "Consolas", "Liberation Mono", monospace; }
      .kicker { font-size: 11px; font-weight: 600; letter-spacing: 2px; fill: #64748b; }
      .title { font-size: 31px; font-weight: 700; letter-spacing: -0.4px; }
      .subtitle { font-size: 13.5px; fill: #5b6b82; }
      .panel-title { font-size: 17px; font-weight: 700; }
      .card-title { font-size: 15.5px; font-weight: 700; }
      .body { font-size: 13px; fill: #334155; }
      .small { font-size: 10.5px; fill: #64748b; }
      .tiny { font-size: 9.5px; fill: #7c8ba1; }
      .hdr { font-size: 12.5px; font-weight: 700; fill: #334155; }
      .key { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-size: 12px; fill: #7f1d1d; }
      .ktype { font-size: 9.5px; fill: #9f6b63; }
      .arwlabel { font-size: 9.5px; fill: #64748b; }
      .arwlabel2 { font-size: 10px; fill: #7c8ba1; }
      .badge { font-size: 10px; font-weight: 700; fill: #ffffff; }
      .mini { font-size: 11.5px; fill: #475569; }
    </style>
