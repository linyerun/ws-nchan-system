    <text x="284" y="227" class="card-title" fill="#1e3a8a">nginx + Nchan</text>

    <text x="254" y="262" class="mono" font-size="12.5" fill="#334155">auth_request /_auth</text>
    <text x="254" y="288" class="mono" font-size="12.5" fill="#334155">nchan_subscriber</text>
    <text x="254" y="314" class="mono" font-size="12.5" fill="#334155">channel u:{uid}</text>
    <text x="254" y="340" class="mono" font-size="12.5" fill="#334155">nchan_publisher</text>

    <line x1="254" y1="364" x2="476" y2="364" stroke="#dbe6fa" stroke-width="1"/>
    <text x="254" y="383" class="mono" font-size="10" fill="#4b6a99">本地发布 /internal/pub</text>
    <text x="254" y="403" class="small">共享内存 64MB · 50 条 / 60s</text>

    <!-- go -->
    <rect x="580" y="194" width="250" height="248" rx="12" fill="#f1fbf5" stroke="#bfe8d2" stroke-width="1.2"/>
    <rect x="594" y="210" width="22" height="22" rx="7" fill="#0f9d63"/>
    <text x="605" y="225" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Go</text>
    <text x="624" y="227" class="card-title" fill="#065f46">Go 控制面</text>

    <text x="594" y="262" class="body">token · presence 心跳</text>
    <text x="594" y="288" class="body">目标解析 / 按节点分组</text>
    <text x="594" y="314" class="mono" font-size="11.5" fill="#334155">bridge SUB push:node:node1</text>
    <text x="594" y="340" class="mono" font-size="11.5" fill="#334155">HTTP :8080 · gRPC :9090</text>

    <line x1="594" y1="364" x2="816" y2="364" stroke="#d3ece0" stroke-width="1"/>
    <text x="594" y="383" class="small">reaper 10s 巡检 · TTL 20s</text>
    <text x="594" y="403" class="small">心跳 5s · 节点 TTL 15s</text>

    <!-- ws -->
    <line x1="190" y1="318" x2="240" y2="318" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#ar-p)"/>
    <circle cx="215" cy="318" r="9.5" fill="#7c3aed" stroke="#ffffff" stroke-width="2.2"/>
    <text x="215" y="321.5" text-anchor="middle" class="badge">1</text>

    <!-- auth -->
    <line x1="490" y1="296" x2="580" y2="296" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-p)"/>
    <text x="535" y="284" text-anchor="middle" class="mono" font-size="9.5" fill="#6d28d9">auth_request</text>
    <text x="535" y="318" text-anchor="middle" class="arwlabel2">校验 token</text>
    <text x="535" y="330" text-anchor="middle" class="arwlabel2">写入 presence</text>

    <circle cx="466" cy="310" r="8.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.8"/>
    <text x="466" y="313.5" text-anchor="middle" class="badge" font-size="9">2</text>

    <!-- local publish -->
    <line x1="580" y1="392" x2="490" y2="392" stroke="#2563eb" stroke-width="1.9" marker-end="url(#ar-b)"/>
    <text x="535" y="379" text-anchor="middle" class="mono" font-size="9.5" fill="#334155">internal/pub</text>
    <text x="535" y="410" text-anchor="middle" class="arwlabel">bridge → Nchan</text>
    <circle cx="535" cy="392" r="9.5" fill="#2563eb" stroke="#ffffff" stroke-width="2.2"/>
    <text x="535" y="395.5" text-anchor="middle" class="badge">5</text>

    <!-- redis out/in -->
    <line x1="830" y1="330" x2="910" y2="330" stroke="#2563eb" stroke-width="1.9" marker-end="url(#ar-b)"/>
    <text x="870" y="317" text-anchor="middle" class="arwlabel">PUBLISH</text>
    <circle cx="870" cy="330" r="9.5" fill="#2563eb" stroke="#ffffff" stroke-width="2.2"/>
    <text x="870" y="333.5" text-anchor="middle" class="badge">4</text>

    <line x1="910" y1="400" x2="830" y2="400" stroke="#2563eb" stroke-width="1.9" marker-end="url(#ar-b)"/>
    <text x="870" y="387" text-anchor="middle" class="arwlabel">SUB</text>
  </g>

