  <rect width="1280" height="950" fill="url(#bg)"/>
  <ellipse cx="1160" cy="90" rx="310" ry="210" fill="url(#glowA)"/>
  <ellipse cx="80" cy="880" rx="290" ry="180" fill="url(#glowB)"/>

  <!-- header -->
  <text x="36" y="38" class="kicker">WS-NCHAN-SYSTEM · 本地可运行示例</text>
  <text x="36" y="78" class="title">Nchan Push Lab 架构总览</text>
  <text x="36" y="108" class="subtitle">nginx + Nchan 持有长连接 · Go 控制面 · Redis 全局状态与跨节点扩散</text>

  <rect x="866" y="24" width="378" height="80" rx="13" fill="#eef6ff" stroke="#c7dcff" stroke-width="1.4"/>
  <rect x="886" y="42" width="26" height="26" rx="8" fill="#2563eb"/>
  <text x="899" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">i</text>
  <text x="924" y="50" class="hdr" fill="#1e3a8a">关键设计</text>
  <text x="924" y="70" font-size="11.5" fill="#334155">socket 由 nginx / Nchan 持有</text>
  <text x="924" y="87" font-size="11.5" fill="#334155">Go 重启不会断开在线连接</text>

  <!-- ================= node1 ================= -->
  <g>
    <rect x="223" y="134" width="640" height="334" rx="18" fill="#0b1a33" opacity="0.07"/>
    <rect x="220" y="130" width="640" height="334" rx="18" fill="#ffffff" stroke="#d9e2f1" stroke-width="1.4"/>

