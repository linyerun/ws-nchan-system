    <text x="594" y="646" class="body">token · presence 心跳</text>
    <text x="594" y="672" class="body">目标解析 / 按节点分组</text>
    <text x="594" y="698" class="mono" font-size="11.5" fill="#334155">bridge SUB push:node:node2</text>
